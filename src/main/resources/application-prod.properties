# Configurações de Produção no Render (Neon PostgreSQL)
spring.jpa.hibernate.ddl-auto=update

# Força o dialeto para o Hibernate não precisar adivinhar se o banco demorar a responder
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Captura as variáveis que configuraremos no painel do Render
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dá tempo para o banco gratuito do Neon "acordar" na primeira requisição
spring.datasource.hikari.connection-timeout=30000

# Garante que o banco use o fuso horário correto para auditoria de orçamentos
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

logging.level.org.hibernate.SQL=WARN



