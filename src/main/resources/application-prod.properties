# Configurações de Produção no Render (Neon PostgreSQL)
server.port=${PORT:8082}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Injeta a URL limpa e passa explicitamente usuário e senha isolados para o driver
# Preferir: defina `SPRING_DATASOURCE_URL` no Render com uma URL JDBC correta.
# Exemplo esperado (sem `channel_binding`):
# jdbc:postgresql://<host>:5432/<dbname>?sslmode=require
# Se `SPRING_DATASOURCE_URL` não estiver definida, constrói uma URL de fallback
# a partir de `DB_HOST`, `DB_PORT` e `DB_NAME` (útil para debug/local).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:ep-jolly-smoke-ackhmqb2-pooler.sa-east-1.aws.neon.tech}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=require}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações de estabilidade e Timeout
spring.datasource.hikari.connection-timeout=30000
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Recomenda: remova `channel_binding=require` do JDBC URL se presente —
# alguns drivers/versões não aceitam o parâmetro com underline e podem falhar.
logging.level.org.hibernate.SQL=WARN
