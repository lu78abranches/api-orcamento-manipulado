# Configurações Globais da Aplicação
spring.application.name=api-orcamento-manipulado
server.port=8082

# Gerenciamento de Perfis (Se não houver variável no ambiente, roda o local por padrão)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Gerenciamento de Segredos e Arquivo .env
spring.config.import=optional:file:.env[.properties]

# Configurações globais que a IA e o JWT precisam ler de forma transparente
gemini.api.enabled=true
gemini.api.url=${GEMINI_API_URL:https://gemini.googleapis.com/v1/models/gemini-3.5-flash-20240624/versions/20240624:predict}
gemini.api.key=${GEMINI_API_KEY:}
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-padrao-super-longa-para-o-jwt-da-farmacia-de-manipulacao}

